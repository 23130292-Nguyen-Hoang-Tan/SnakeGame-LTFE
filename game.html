<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake Adventure</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background-image: url("img/home-bg.jpg");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }
        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.18);
            z-index: -1;
        }

        .game-container {
            width: min(900px, 94vw);
            text-align: center;
        }

        .game-title {
            color: white;
            font-size: 36px;
            font-weight: 900;
            margin-bottom: 12px;
            text-shadow:
                3px 3px 0 #5b351d,
                0 0 10px rgba(0, 0, 0, 0.5);
        }
        .level-name {
            display: block;
            font-size: 20px;
            margin-top: 4px;
            color: #ffe082;
            text-shadow: 2px 2px 0 #5b351d;
        }

        .game-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            max-width: 760px;
            margin: 0 auto 10px;
            padding: 10px 18px;
            background: rgba(58, 35, 18, 0.85);
            border: 4px solid #70421f;
            border-radius: 12px;
            color: white;
            font-size: 18px;
            font-weight: bold;
            box-shadow: 0 5px 0 rgba(0, 0, 0, 0.25);
        }

        .score {
            color: #ffe082;
        }
        .lives {
            color: #ff8a80;
        }

        .board-wrapper {
            display: inline-block;
            border: 12px solid #70421f;
            border-radius: 10px;
            background: #70421f;
            box-shadow:
                0 8px 0 rgba(0, 0, 0, 0.3),
                0 12px 25px rgba(0, 0, 0, 0.35);
        }

        canvas {
            display: block;
            background: #65a936;
            width: 720px;
            height: 480px;
            max-width: 80vw;
            max-height: 60vh;
            image-rendering: pixelated;
        }

        .controls {
            margin-top: 12px;
            color: white;
            font-size: 15px;
            font-weight: bold;
            text-shadow: 2px 2px 3px rgba(0, 0, 0, 0.7);
        }
        .key {
            display: inline-block;
            min-width: 30px;
            padding: 4px 7px;
            margin: 0 2px;
            background: white;
            color: #333;
            border-radius: 5px;
            box-shadow: 0 3px 0 #aaa;
        }

        .buttons {
            margin-top: 14px;
            display: flex;
            justify-content: center;
            gap: 12px;
        }
        button {
            border: none;
            border-radius: 9px;
            padding: 10px 22px;
            font-size: 16px;
            font-weight: 800;
            cursor: pointer;
            color: white;
            box-shadow: 0 5px 0 rgba(0, 0, 0, 0.25);
            transition: transform 0.1s;
        }

        button:active {
            transform: translateY(4px);
            box-shadow: 0 1px 0 rgba(0, 0, 0, 0.25);
        }
        .pause-btn {
            background: #d68910;
        }

        .game-over {
            position: fixed;
            inset: 0;
            display: none;
            justify-content: center;
            align-items: center;
            background: rgba(0, 0, 0, 0.65);
        }
        .game-over-box {
            width: min(400px, 90vw);
            padding: 30px;
            background: #fff8e7;
            border: 7px solid #70421f;
            border-radius: 16px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
        }
        .game-over-box h2 {
            color: #d35400;
            font-size: 34px;
            margin-bottom: 12px;
            gap: 6px;
        }
        .game-over-box p {
            color: #333;
            font-size: 18px;
            margin-bottom: 18px;
        }
        .restart-btn {
            background: #e67e22;
        }
        .home-btn {
            background: #3498db;
        }

        .win-modal {
            position: fixed; 
            inset: 0; 
            display: none;
            justify-content: center; 
            align-items: center;
            background: rgba(0, 0, 0, 0.65);
        }

        .win-box {
            width: min(400px, 90vw); 
            padding: 30px;
            background: #fff8e7; 
            border: 7px solid #70421f;
            border-radius: 16px; 
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
        }

        .win-box h2 {
            color: #27ae60; font-size: 32px; margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="game-container">
        <!-- TITLE -->
        <h1 class="game-title">
            🐍 SNAKE ADVENTURE
            <span class="level-name" id="levelName">LEVEL 1</span>
        </h1>
        <!-- ĐIỂM + MẠNG -->
       <div class="game-info">
            <div>Điểm: <span class="score" id="score">0</span></div>
            <div>Mạng: <span class="lives" id="lives">❤️❤️❤️</span></div>
            <!-- Chỉ hiện ở Level 3 -->
            <div id="portalTimer" style="display: none;">
                Cổng đổi sau:
                <span id="portalTime">15</span>s
            </div>
        </div>

        <!-- SÂN CHƠI -->
        <div class="board-wrapper">
            <canvas id="gameCanvas" width="720" height="480"></canvas>
        </div>
        <!-- DỪNG -->
        <div class="buttons">
            <button class="pause-btn" onclick="togglePause()">⏸ DỪNG GAME</button>
        </div>
    </div>

    <!--GAME OVER-->
    <div class="game-over" id="gameOver">
        <div class="game-over-box">
            <h2>GAME OVER</h2>
            <p> Điểm của bạn: <strong id="finalScore"> 0 </strong></p>
            <button class="restart-btn" onclick="restartGame()">CHƠI LẠI</button>
            <br><br>
            <button class="home-btn" onclick="goHome()">TRANG CHỦ</button>
        </div>
    </div>

    <!-- MODAL CHIẾN THẮNG -->
    <div class="win-modal" id="winModal">
        <div class="win-box">
            <h2>BẠN ĐÃ THẮNG</h2>
            <button class="home-btn" onclick="goHome()">TRANG CHỦ</button>
        </div>
    </div>

    <script src="gameLogic.js"></script>
</body>
</html>
