<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake Adventure</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        /*BACKGROUND */
        body {
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background-image: url("img/home-bg.jpg");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }
        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.18);
            z-index: -1;
        }

        /*GAME CONTAINER*/
        .game-container {
            width: min(900px, 94vw);
            text-align: center;
        }

        /*TITLE*/
        .game-title {
            color: white;
            font-size: 36px;
            font-weight: 900;
            margin-bottom: 12px;
            text-shadow:
                3px 3px 0 #5b351d,
                0 0 10px rgba(0, 0, 0, 0.5);
        }
        .level-name {
            display: block;
            font-size: 20px;
            margin-top: 4px;
            color: #ffe082;
            text-shadow: 2px 2px 0 #5b351d;
        }

        /*GAME INFO*/
        .game-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            max-width: 760px;
            margin: 0 auto 10px;
            padding: 10px 18px;
            background: rgba(58, 35, 18, 0.85);
            border: 4px solid #70421f;
            border-radius: 12px;
            color: white;
            font-size: 18px;
            font-weight: bold;
            box-shadow: 0 5px 0 rgba(0, 0, 0, 0.25);
        }

        .score {
            color: #ffe082;
        }
        .lives {
            color: #ff8a80;
        }

        /*GAME BOARD*/
        .board-wrapper {
            display: inline-block;
            border: 12px solid #70421f;
            border-radius: 10px;
            background: #70421f;
            box-shadow:
                0 8px 0 rgba(0, 0, 0, 0.3),
                0 12px 25px rgba(0, 0, 0, 0.35);
        }

        canvas {
            display: block;
            background: #65a936;
            width: 720px;
            height: 480px;
            max-width: 80vw;
            max-height: 60vh;
            image-rendering: pixelated;
        }

        /*CONTROLS*/
        .controls {
            margin-top: 12px;
            color: white;
            font-size: 15px;
            font-weight: bold;
            text-shadow: 2px 2px 3px rgba(0, 0, 0, 0.7);
        }
        .key {
            display: inline-block;
            min-width: 30px;
            padding: 4px 7px;
            margin: 0 2px;
            background: white;
            color: #333;
            border-radius: 5px;
            box-shadow: 0 3px 0 #aaa;
        }

        /*PAUSE BUTTON*/
        .buttons {
            margin-top: 14px;
            display: flex;
            justify-content: center;
            gap: 12px;
        }
        button {
            border: none;
            border-radius: 9px;
            padding: 10px 22px;
            font-size: 16px;
            font-weight: 800;
            cursor: pointer;
            color: white;
            box-shadow: 0 5px 0 rgba(0, 0, 0, 0.25);
            transition: transform 0.1s;
        }

        button:active {
            transform: translateY(4px);
            box-shadow: 0 1px 0 rgba(0, 0, 0, 0.25);
        }
        .pause-btn {
            background: #d68910;
        }

        /* GAME OVER*/
        .game-over {
            position: fixed;
            inset: 0;
            display: none;
            justify-content: center;
            align-items: center;
            background: rgba(0, 0, 0, 0.65);
        }
        .game-over-box {
            width: min(400px, 90vw);
            padding: 30px;
            background: #fff8e7;
            border: 7px solid #70421f;
            border-radius: 16px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
        }
        .game-over-box h2 {
            color: #d35400;
            font-size: 34px;
            margin-bottom: 12px;
            gap: 6px;
        }
        .game-over-box p {
            color: #333;
            font-size: 18px;
            margin-bottom: 18px;
        }
        .restart-btn {
            background: #e67e22;
        }
        .home-btn {
            background: #3498db;
        }
    </style>
</head>
<body>
    <div class="game-container">
        <!-- TITLE -->
        <h1 class="game-title">
            🐍 SNAKE ADVENTURE
            <span class="level-name" id="levelName">LEVEL 1</span>
        </h1>
        <!-- ĐIỂM + MẠNG -->
       <div class="game-info">
            <div>Điểm: <span class="score" id="score">0</span></div>
            <div>Mạng: <span class="lives" id="lives">❤️❤️❤️</span></div>

            <!-- Chỉ hiện ở Level 3 -->
            <div id="portalTimer" style="display: none;">
                Cổng đổi sau:
                <span id="portalTime">15</span>s
            </div>
        </div>

        <!-- SÂN CHƠI -->
        <div class="board-wrapper">
            <canvas id="gameCanvas" width="720" height="480"></canvas>
        </div>
        <!-- DỪNG -->
        <div class="buttons">
            <button class="pause-btn" onclick="togglePause()">⏸ DỪNG GAME</button>
        </div>
    </div>

    <!--GAME OVER-->
    <div class="game-over" id="gameOver">
        <div class="game-over-box">
            <h2>GAME OVER</h2>
            <p> Điểm của bạn: <strong id="finalScore"> 0 </strong></p>
            <button class="restart-btn" onclick="restartGame()">CHƠI LẠI</button>
            <br><br>
            <button class="home-btn" onclick="goHome()">TRANG CHỦ</button>
        </div>
    </div>

    <script>
        // ĐỌC CẤU HÌNH LEVEL
        const savedConfig =
            localStorage.getItem("snakeLevelConfig");
        const levelConfig = savedConfig
            ? JSON.parse(savedConfig)
            : {
                level: "level1",
                speed: 120,
                lives: 3,
                growSnake: true,
                food10: true,
                obstacles: false
            };

        // CANVAS
        const canvas =document.getElementById("gameCanvas");
        const ctx =canvas.getContext("2d");
        const GRID_SIZE = 24;
        const COLS =canvas.width / GRID_SIZE;
        const ROWS =canvas.height / GRID_SIZE;

        // BIẾN GAME
        let snake;
        let direction;
        let nextDirection;
        let food;
        let score = 0;
        let lives = levelConfig.lives || 3;
        let gameRunning = true;
        let gameLoop;
        let isPaused = false;
        let obstacles = [];
        let snakeVisible = true;
        let lifeBuff = null;
        let lifeBuffSpawned = false;
        let lifeBuffCollected = false;
         let portals = [];
        let portalTimer = null;
        let portalCountdown = 15;
        const MAP_SPLIT_LEFT = 14;
        const MAP_SPLIT_RIGHT = 15;
        const PORTAL_WIDTH = 1;
        const PORTAL_HEIGHT = 2;
        const PORTAL_MARGIN = 2;
        const portalTimerElement =
        document.getElementById("portalTimer");
        const portalTimeElement =
            document.getElementById("portalTime");
        if (levelConfig.level === "level3") {
            portalTimerElement.style.display ="block";
        }
        let bullets = [];
        let bulletTimer = null;
        const BULLET_INTERVAL = 1500;
        const BULLET_SPEED = 1;
        const BULLET_RADIUS = 7;
        const BULLET_SPAWN_POINTS = {
            top: [8, 22],
            bottom: [8, 22],
            left: [6, 13],
            right: [6, 13]
        };

        // LEVEL 5 - BOT SĂN THỨC ĂN
        let bot = null;
        let botSize = 2;
        let botScore = 0;
        let botMoveCounter = 0;
        let botTimer = null;
        let slowBuff = null;
        let slowBuffCount = 0;
        let slowEffectUntil = 0;
        let slowSkipMove = false;
        const BOT_NORMAL_INTERVAL = 120; // Rắn 120ms, bot chậm hơn 2 lần
        const BOT_SLOW_INTERVAL = 720; // Khi ăn buff: bot chậm hơn 4 lần so với tốc độ mặc định
        const SLOW_BUFF_EVERY_FOODS = 8;
        const SLOW_DURATION = 5000;

        // HIỂN THỊ LEVEL
        document.getElementById("levelName")
            .textContent =
            String(levelConfig.level || "level1")
                .toUpperCase();

        // KHỞI TẠO GAME
        function initGame() {
            snake = [
                { x: 7, y: 10 },
                { x: 6, y: 10 },
                { x: 5, y: 10 }
            ];
            direction = { x: 1, y: 0 };
            nextDirection = { x: 1, y: 0 };
            score = 0;
            lives = levelConfig.lives || 3;
            gameRunning = true;
            isPaused = false;
            snakeVisible = true;
            lifeBuff = null;
            lifeBuffSpawned = false;
            lifeBuffCollected = false;
            bullets = [];
            stopBulletTimer();

            // Reset cơ chế Level 5
            bot = null;
            botSize = 2;
            botScore = 0;
            botMoveCounter = 0;
            stopBotTimer();
            slowBuff = null;
            slowBuffCount = 0;
            slowEffectUntil = 0;
            slowSkipMove = false;

            createObstacles();
            if (levelConfig.level === "level3") {
                createPortals();
                startPortalTimer();
            }
            else {
                portals = [];
                stopPortalTimer();
            }
            if (levelConfig.level === "level4") {
                startBulletTimer();
            }
            createFood();

            if (levelConfig.level === "level5") {
                createBot();
                startBotTimer();
            }

            updateInfo();
            document.getElementById("gameOver").style.display = "none";
            document.querySelector(".pause-btn").textContent = "⏸ DỪNG GAME";
            clearInterval(gameLoop);
            gameLoop = setInterval(updateGame, levelConfig.speed || 120);
            drawGame();
        }

        // DỪNG / TIẾP TỤC
        function togglePause() {
            if (!gameRunning) {
                return;
            }
            isPaused = !isPaused;
            const button =
                document.querySelector(".pause-btn");
            if (isPaused) {
                button.textContent = "▶ TIẾP TỤC";
            } else {
                button.textContent ="⏸ DỪNG GAME";
            }
        }

        // TẠO THỨC ĂN
        function createFood() {
            let validPosition = false;
            let attempts = 0;
            while (!validPosition && attempts < 1000) {
                attempts++;
                const x = Math.floor(Math.random() * COLS);
                const y = Math.floor(Math.random() * ROWS);
                // Không spawn trên rắn
                const onSnake = snake.some(segment => segment.x === x && segment.y === y);
                if (onSnake) {
                    continue;
                }
                // Không spawn trên địa hình
                const onObstacle = obstacles.some(obstacle =>
                    x >= obstacle.x &&
                    x < obstacle.x + obstacle.width &&
                    y >= obstacle.y &&
                    y < obstacle.y + obstacle.height
                );
                if (onObstacle) {
                    continue;
                }
                /* Không spawn trên cổng */
                if (isPortalCell(x, y)) {
                    continue;
                }
                // Level 5: không đặt thức ăn chồng lên bot.
                if (levelConfig.level === "level5" && botContainsCell(x, y)) {
                    continue;
                }
                /* Không spawn tại buff */
                if (lifeBuff && lifeBuff.x === x && lifeBuff.y === y) {
                    continue;
                }
                food = {x: x,y: y,value: 10};
                validPosition = true;
            }
        }

        //KIỂM TRA ĐẦU RẮN CÓ VƯỢT ĐƯỜNG GIỮA
        function crossesMapSplit(head) {
            return (head.x === MAP_SPLIT_LEFT || head.x === MAP_SPLIT_RIGHT);
        }


        // TẠO BUFF HỒI MẠNG
        function createLifeBuff() {
            if (levelConfig.level === "level1") {
                return;
            }
            // Buff chỉ được tạo đúng 1 lần
            if (lifeBuffSpawned) {
                return;
            }
            let validPosition = false;
            let attempts = 0;
            while (!validPosition && attempts < 1000) {
                attempts++;
                const x = Math.floor(Math.random() * COLS);
                const y = Math.floor(Math.random() * ROWS);
                // Không spawn trên rắn
                const onSnake = snake.some(
                    segment =>
                        segment.x === x &&
                        segment.y === y
                );
                if (onSnake) {
                    continue;
                }
                // Không spawn trên địa hình
                const onObstacle = obstacles.some(obstacle =>
                    x >= obstacle.x &&
                    x < obstacle.x + obstacle.width &&
                    y >= obstacle.y &&
                    y < obstacle.y + obstacle.height
                );
                if (onObstacle) {
                    continue;
                }
                // Không spawn trùng thức ăn
                if (food && food.x === x && food.y === y) {
                    continue;
                }
                // Vị trí hợp lệ
                lifeBuff = {x: x,y: y};
                lifeBuffSpawned = true;
                validPosition = true;
            }
        }

        // UPDATE GAME
        function updateGame() {
            if (!gameRunning || isPaused) {
                return;
            }

            updateBullets();
            if (!gameRunning) return;

            direction = nextDirection;
            const head = {
                x: snake[0].x + direction.x,
                y: snake[0].y + direction.y
            };

            // VA CHẠM TƯỜNG
            if (head.x < 0 || head.x >= COLS || head.y < 0 || head.y >= ROWS) {
                loseLife();
                return;
            }
            // VA CHẠM THÂN
            const hitSelf = snake.some(segment =>segment.x === head.x &&segment.y === head.y);
            if (hitSelf) {
                loseLife();
                return;
            }

            // VA CHẠM ĐỊA HÌNH
            const hitObstacle = obstacles.some(obstacle =>
                head.x >= obstacle.x &&
                head.x < obstacle.x + obstacle.width &&
                head.y >= obstacle.y &&
                head.y < obstacle.y + obstacle.height
            );
            if (hitObstacle) {
                loseLife();
                return;
            }
            if (levelConfig.level === "level3") {
                if (head.x === MAP_SPLIT_LEFT || head.x === MAP_SPLIT_RIGHT) {
                    loseLife();
                    return;
                }
            }
            //THÊM ĐẦU
            snake.unshift(head);

            // LEVEL 5: chỉ ĐẦU rắn chạm bot mới mất mạng.
            if (levelConfig.level === "level5" && botContainsCell(head.x, head.y)) {
                loseLife();
                return;
            }

            //ĂN THỨC ĂN
            if (head.x === food.x && head.y === food.y) {

                score += food.value;
                // LEVEL 2:
                if (levelConfig.level !== "level1" &&score >= 100 &&!lifeBuffSpawned) {
                    createLifeBuff();
                }
                // Kiểm tra sang level tiếp theo
                if (score >= 150) { 
                    checkNextLevel();
                    return;
                }
                createFood();

                // LEVEL 5: cứ mỗi 8 thức ăn người chơi ăn được thì xuất hiện 1 buff làm chậm.
                if (levelConfig.level === "level5") {
                    const foodsEaten = Math.floor(score / 10);
                    if (foodsEaten > 0 && foodsEaten % SLOW_BUFF_EVERY_FOODS === 0) {
                        createSlowBuff();
                    }
                }

                // LEVEL 4 và LEVEL 5: ăn điểm nhưng KHÔNG tăng chiều dài
                if (levelConfig.level === "level4" || levelConfig.level === "level5") {
                    snake.pop();
                }
            } else {
                snake.pop();
            }
            // ĂN BUFF HỒI MẠNG
            if (levelConfig.level !== "level1" &&lifeBuff && head.x === lifeBuff.x && lifeBuff && head.y === lifeBuff.y) {
                // Hồi 1 mạng
                lives++;
                updateInfo();
                lifeBuff = null;
                lifeBuffCollected = true;
                console.log("Đã ăn buff hồi mạng! +1 mạng");
            }

            // LEVEL 5: ăn buff làm chậm
            if (levelConfig.level === "level5" && slowBuff && head.x === slowBuff.x && head.y === slowBuff.y) {
                slowBuff = null;
                slowEffectUntil = Date.now() + SLOW_DURATION;
                slowSkipMove = false;
            }

            if (levelConfig.level === "level3" && isPortalCell(head.x, head.y)) {
                teleportSnake();
                }
                    updateInfo();
                    drawGame();
            }

            // LEVEL 4
            function startBulletTimer() {
                stopBulletTimer();
                bulletTimer = setInterval(() => {
                    if (!gameRunning || isPaused) return;
                    createBullet();
                }, BULLET_INTERVAL);
            }
            function stopBulletTimer() {
                if (bulletTimer) {
                    clearInterval(bulletTimer);
                    bulletTimer = null;
                }
            }
            //TẠO ĐẠN
            function createBullet() {
                if (levelConfig.level !== "level4") return;
                const sides = ["top", "bottom", "left", "right"];
                const side = sides[Math.floor(Math.random() * sides.length)];
                const index = Math.floor(Math.random() * 2);
                let bullet;
                if (side === "top") {
                    bullet = {x: BULLET_SPAWN_POINTS.top[index], y: 0, dx: 0, dy: BULLET_SPEED};
                } else if (side === "bottom") {
                    bullet = {x: BULLET_SPAWN_POINTS.bottom[index], y: ROWS - 1, dx: 0, dy: -BULLET_SPEED};
                } else if (side === "left") {
                    bullet = {x: 0, y: BULLET_SPAWN_POINTS.left[index], dx: BULLET_SPEED, dy: 0};
                } else {
                    bullet = {x: COLS - 1, y: BULLET_SPAWN_POINTS.right[index], dx: -BULLET_SPEED, dy: 0};
                }
                bullets.push(bullet);
            }
            //CẬP NHẬP ĐẠN
            function updateBullets() {
                if (levelConfig.level !== "level4" || !gameRunning || isPaused) return;
                for (let i = bullets.length - 1; i >= 0; i--) {
                    const bullet = bullets[i];
                    bullet.x += bullet.dx;
                    bullet.y += bullet.dy;
                    const hitSnake = snake.some(segment =>
                        Math.abs(segment.x - bullet.x) < 0.5 &&
                        Math.abs(segment.y - bullet.y) < 0.5
                    );
                    if (hitSnake) {
                        bullets.splice(i, 1);
                        loseLife();
                        if (!gameRunning) return;
                        continue;
                    }
                    if (bullet.x < -1 || bullet.x > COLS || bullet.y < -1 || bullet.y > ROWS) {
                        bullets.splice(i, 1);
                    }
                }
            }
            //VẼ PHÁO
            function drawBulletCannons() {
                if (levelConfig.level !== "level4") return;
                const points = [
                    {x: BULLET_SPAWN_POINTS.top[0], y: 0},
                    {x: BULLET_SPAWN_POINTS.top[1], y: 0},
                    {x: BULLET_SPAWN_POINTS.bottom[0], y: ROWS - 1},
                    {x: BULLET_SPAWN_POINTS.bottom[1], y: ROWS - 1},
                    {x: 0, y: BULLET_SPAWN_POINTS.left[0]},
                    {x: 0, y: BULLET_SPAWN_POINTS.left[1]},
                    {x: COLS - 1, y: BULLET_SPAWN_POINTS.right[0]},
                    {x: COLS - 1, y: BULLET_SPAWN_POINTS.right[1]}
                ];
                points.forEach(point => {
                    const px = point.x * GRID_SIZE + GRID_SIZE / 2;
                    const py = point.y * GRID_SIZE + GRID_SIZE / 2;
                    ctx.fillStyle = "#4a2a14";
                    ctx.beginPath();
                    ctx.arc(px, py, 9, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = "#8b5a2b";
                    ctx.beginPath();
                    ctx.arc(px, py, 5, 0, Math.PI * 2);
                    ctx.fill();
                });
            }
            //VẼ ĐẠN
            function drawBullets() {
                if (levelConfig.level !== "level4") return;
                bullets.forEach(bullet => {
                    const px = bullet.x * GRID_SIZE + GRID_SIZE / 2;
                    const py = bullet.y * GRID_SIZE + GRID_SIZE / 2;
                    ctx.beginPath();
                    ctx.fillStyle = "#222";
                    ctx.arc(px, py, BULLET_RADIUS, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.beginPath();
                    ctx.fillStyle = "#ff5722";
                    ctx.arc(px, py, 3, 0, Math.PI * 2);
                    ctx.fill();
                });
            }


            // MẤT MẠNG
            function loseLife() {
                lives--;
                updateInfo();
                if (lives <= 0) {
                    endGame();
                    return;
                }
                snake = [
                    {x: 10, y: 10},
                    {x: 9, y: 10},
                    {x: 8, y: 10}
                ];
                direction = {x: 1, y: 0};
                nextDirection = {x: 1, y: 0};
                createFood();
                drawGame();
        }

        // GAME OVER
        function endGame() {
            gameRunning = false;
            clearInterval(gameLoop);
            stopPortalTimer();
            stopBulletTimer();
            stopBotTimer();
            document.getElementById("finalScore").textContent = score;
            document.getElementById("gameOver").style.display = "flex";
        }

        // DRAW GAME
        function drawGame() {
            // NỀN
            ctx.fillStyle = "#65a936";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            drawFood();
            drawSnake();
            drawObstacles();
            drawLifeBuff();
            drawSlowBuff();
            drawBot();
            drawMapSplit();
            drawPortals();
            drawBulletCannons();
            drawBullets();
        }

        // ==================== LEVEL 5 - BOT ====================
        // Bot 2x2, tự tìm đường đến thức ăn bằng BFS.
        function createBot() {
            if (levelConfig.level !== "level5") return;
            const positions = [
                { x: COLS - 4, y: 3 },
                { x: COLS - 5, y: ROWS - 5 },
                { x: 20, y: 3 },
                { x: 20, y: 14 }
            ];

            let chosen = positions[Math.floor(Math.random() * positions.length)];
            bot = {
                x: chosen.x,
                y: chosen.y,
                width: 2,
                height: 2
            };

            // Nếu vị trí ngẫu nhiên đè lên rắn/địa hình thì tìm vị trí hợp lệ.
            if (!isBotPositionValid(bot.x, bot.y, bot.width, bot.height)) {
                for (let y = 1; y < ROWS - bot.height; y++) {
                    for (let x = 1; x < COLS - bot.width; x++) {
                        if (isBotPositionValid(x, y, bot.width, bot.height)) {
                            bot.x = x;
                            bot.y = y;
                            return;
                        }
                    }
                }
            }
        }

        function isBotPositionValid(x, y, width, height) {
            if (x < 0 || y < 0 || x + width > COLS || y + height > ROWS) {
                return false;
            }

            const overlapsSnake = snake.some(segment =>
                segment.x >= x && segment.x < x + width &&
                segment.y >= y && segment.y < y + height
            );
            if (overlapsSnake) return false;

            const overlapsObstacle = obstacles.some(obstacle =>
                x < obstacle.x + obstacle.width &&
                x + width > obstacle.x &&
                y < obstacle.y + obstacle.height &&
                y + height > obstacle.y
            );
            if (overlapsObstacle) return false;

            return true;
        }

        function botContainsCell(x, y) {
            if (!bot) return false;
            return (
                x >= bot.x && x < bot.x + bot.width &&
                y >= bot.y && y < bot.y + bot.height
            );
        }

        // Bot mặc định chậm hơn rắn 2 lần: rắn 120ms / bot 240ms.
        // Khi người chơi ăn buff đóng băng, bot chậm đi 4 lần so với tốc độ mặc định: 960ms.
        function startBotTimer() {
            stopBotTimer();
            if (levelConfig.level !== "level5") return;

            botTimer = setInterval(() => {
                if (!gameRunning || isPaused) return;
                updateBot();
            }, 100);
        }

        function stopBotTimer() {
            if (botTimer) {
                clearInterval(botTimer);
                botTimer = null;
            }
        }

        function getBotMoveInterval() {
            if (slowEffectUntil > 0 && Date.now() < slowEffectUntil) {
                return BOT_SLOW_INTERVAL;
            }
            return BOT_NORMAL_INTERVAL;
        }

        function updateBot() {
            if (levelConfig.level !== "level5" || !bot || !food) return;
            // Timer mặc định gọi mỗi 240ms. Nếu đang bị đóng băng,
            // chỉ cho bot thực sự di chuyển mỗi 960ms.
            const now = Date.now();
            if (bot._lastMoveTime && now - bot._lastMoveTime < getBotMoveInterval()) {
                return;
            }
            bot._lastMoveTime = now;

            const path = findBotPath();
            if (path.length >= 2) {
                const next = path[1];
                bot.x = next.x;
                bot.y = next.y;
            }

            // Bot ăn thức ăn bằng vùng 2x2 hoặc 4x4.
            if (botContainsCell(food.x, food.y)) {
                botScore += food.value;

                // 10 lần ăn x 10 điểm = 100 điểm mới tăng kích thước.
                if (botScore >= 100 && botSize < 4) {
                    botSize = 4;
                    bot.width = 4;
                    bot.height = 4;
                }
                createFood();
            }
            // Chỉ đầu rắn chạm Bot mới mất mạng.
            if (botContainsCell(snake[0].x, snake[0].y)) {
                loseLife();
            }
        }

        // BFS tìm đường ngắn nhất từ bot đến thức ăn.
        function findBotPath() {
            if (!bot || !food) return [];

            const start = { x: bot.x, y: bot.y };
            const target = { x: food.x, y: food.y };
            const queue = [start];
            const visited = new Set([`${start.x},${start.y}`]);
            const parent = new Map();
            while (queue.length > 0) {
                const current = queue.shift();
                if (current.x === target.x && current.y === target.y) {
                    return reconstructBotPath(parent, start, target);
                }
                const directions = [
                    { x: 1, y: 0 },
                    { x: -1, y: 0 },
                    { x: 0, y: 1 },
                    { x: 0, y: -1 }
                ];
                directions.sort(() => Math.random() - 0.5);
                for (const dir of directions) {
                    const nx = current.x + dir.x;
                    const ny = current.y + dir.y;
                    const key = `${nx},${ny}`;

                    if (visited.has(key)) continue;
                    if (!isBotMoveValid(nx, ny)) continue;

                    visited.add(key);
                    parent.set(key, current);
                    queue.push({ x: nx, y: ny });
                }
            }
            return [];
        }

        function isBotMoveValid(x, y) {
            if (x < 0 || y < 0 || x + bot.width > COLS || y + bot.height > ROWS) {
                return false;
            }

            // Không đi xuyên qua địa hình.
            const hitsObstacle = obstacles.some(obstacle =>
                x < obstacle.x + obstacle.width &&
                x + bot.width > obstacle.x &&
                y < obstacle.y + obstacle.height &&
                y + bot.height > obstacle.y
            );
            if (hitsObstacle) return false;

            // Tránh thân rắn để bot có cảm giác đang chủ động tìm đường.
            const hitsSnake = snake.some(segment =>
                segment.x >= x && segment.x < x + bot.width &&
                segment.y >= y && segment.y < y + bot.height
            );

            // Cho phép bot tiến vào vị trí có thức ăn.
            if (hitsSnake && !(food.x >= x && food.x < x + bot.width && food.y >= y && food.y < y + bot.height)) {
                return false;
            }

            return true;
        }

        function reconstructBotPath(parent, start, target) {
            const path = [target];
            let current = target;

            while (!(current.x === start.x && current.y === start.y)) {
                const previous = parent.get(`${current.x},${current.y}`);
                if (!previous) return [];
                path.unshift(previous);
                current = previous;
            }

            return path;
        }

        // Buff làm chậm xuất hiện sau mỗi 8 thức ăn người chơi đã ăn.
        function createSlowBuff() {
            if (levelConfig.level !== "level5") return;
            if (slowBuff) return;

            let attempts = 0;
            while (attempts < 1000) {
                attempts++;
                const x = Math.floor(Math.random() * COLS);
                const y = Math.floor(Math.random() * ROWS);

                if (snake.some(segment => segment.x === x && segment.y === y)) continue;
                if (botContainsCell(x, y)) continue;
                if (food && food.x === x && food.y === y) continue;
                if (obstacles.some(obstacle =>
                    x >= obstacle.x && x < obstacle.x + obstacle.width &&
                    y >= obstacle.y && y < obstacle.y + obstacle.height
                )) continue;

                slowBuff = { x, y };
                return;
            }
        }

        function isSnakeSlowed() {
            if (levelConfig.level !== "level5") return false;
            if (slowEffectUntil <= 0) return false;

            if (Date.now() >= slowEffectUntil) {
                slowEffectUntil = 0;
                slowSkipMove = false;
                return false;
            }

            return true;
        }

        function drawBot() {
            if (levelConfig.level !== "level5" || !bot) return;

            const x = bot.x * GRID_SIZE;
            const y = bot.y * GRID_SIZE;
            const width = bot.width * GRID_SIZE;
            const height = bot.height * GRID_SIZE;

            // Thân bot
            ctx.fillStyle = "#7b1fa2";
            ctx.fillRect(x + 2, y + 2, width - 4, height - 4);

            // Viền
            ctx.strokeStyle = "#4a148c";
            ctx.lineWidth = 4;
            ctx.strokeRect(x + 2, y + 2, width - 4, height - 4);

            // Mắt để dễ nhận diện bot.
            ctx.fillStyle = "#ffffff";
            const eyeSize = botSize >= 4 ? 6 : 4;
            ctx.fillRect(x + width * 0.25, y + height * 0.25, eyeSize, eyeSize);
            ctx.fillRect(x + width * 0.65, y + height * 0.25, eyeSize, eyeSize);
            ctx.fillStyle = "#222222";
            ctx.fillRect(x + width * 0.27, y + height * 0.27, 2, 2);
            ctx.fillRect(x + width * 0.67, y + height * 0.27, 2, 2);
        }

        function drawSlowBuff() {
            if (levelConfig.level !== "level5" || !slowBuff) return;

            const x = slowBuff.x * GRID_SIZE;
            const y = slowBuff.y * GRID_SIZE;
            const pulse = 2 + Math.sin(Date.now() / 150) * 2;

            ctx.fillStyle = "#29b6f6";
            ctx.fillRect(x + 3 - pulse / 2, y + 3 - pulse / 2,
                GRID_SIZE - 6 + pulse, GRID_SIZE - 6 + pulse);

            ctx.fillStyle = "#ffffff";
            ctx.font = "bold 17px Arial";
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            ctx.fillText("❄", x + GRID_SIZE / 2, y + GRID_SIZE / 2 + 1);
        }

        // DRAW SNAKE
        function drawSnake() {
            snake.forEach(
                (segment, index) => {
                    const x =segment.x *GRID_SIZE;
                    const y =segment.y *GRID_SIZE;
                    if (index === 0) {
                        // ĐẦU
                        ctx.fillStyle ="#ffcc00";
                        ctx.fillRect(x + 2,y + 2,GRID_SIZE - 4,GRID_SIZE - 4);
                    } else {
                        // THÂN
                        ctx.fillStyle ="#ff8c00";
                        ctx.fillRect(x + 3, y + 3, GRID_SIZE - 6, GRID_SIZE - 6);
                    }
                }
            );
        }

        // DRAW FOOD
        function drawFood() {
            const x = food.x * GRID_SIZE;
            const y = food.y * GRID_SIZE;
            ctx.fillStyle = "#FFD700";
            ctx.fillRect(x + 3,y + 3,GRID_SIZE - 6,GRID_SIZE - 6);
        }

        // DRAW BUFF HỒI MẠNG
        function drawLifeBuff() {
            if (levelConfig.level === "level1" ||!lifeBuff) {
                return;
            }
            const x = lifeBuff.x * GRID_SIZE;
            const y = lifeBuff.y * GRID_SIZE;
            ctx.fillStyle = "#e91e63";
            ctx.fillRect(x + 2,y + 2,GRID_SIZE - 4,GRID_SIZE - 4);
            // Biểu tượng +
            ctx.fillStyle = "#ffffff";
            ctx.font = "bold 18px Arial";
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            ctx.fillText("+", x + GRID_SIZE / 2, y + GRID_SIZE / 2);
        }

        // ĐIỀU KHIỂN
        document.addEventListener(
            "keydown",
            function(event) {
                const key = event.key.toLowerCase();
                // LÊN
                if (key === "arrowup" ||key === "w") {
                    if (direction.y !== 1) {
                        nextDirection = {x: 0,y: -1};
                    }
                }
                // XUỐNG
                else if (key === "arrowdown" || key === "s"
                ) {
                    if (direction.y !== -1) {
                        nextDirection = {x: 0, y: 1};
                    }
                }
                // TRÁI
                else if ( key === "arrowleft" || key === "a") {
                    if (direction.x !== 1) {
                        nextDirection = {x: -1, y: 0};
                    }
                }
                // PHẢI
                else if (key === "arrowright" ||key === "d") {
                    if (direction.x !== -1) {
                        nextDirection = {x: 1,y: 0};
                    }
                }
                // KHÔNG SCROLL
                if (key === "arrowup" ||key === "arrowdown" ||key === "arrowleft" ||key === "arrowright") {
                    event.preventDefault();
                }
            }
        );

        // CREAT OBSTACLES
        function createObstacles() {
            obstacles = [];
            // Level 1 không có địa hình
            if (!levelConfig.obstacles) {
                return;
            }
            const count = levelConfig.obstacleCount || 4;
            const size = levelConfig.obstacleSize || 4;
            let attempts = 0;
            while (obstacles.length < count && attempts < 1000) {
                attempts++;
                // Đảm bảo địa hình 4x4 không vượt khỏi board
                const x = Math.floor( Math.random() * (COLS - size));
                const y = Math.floor( Math.random() * (ROWS - size));
                const newObstacle = {x: x, y: y, width: size, height: size};
                // Không để địa hình đè lên rắn
                const overlapsSnake = snake.some(segment =>
                    segment.x >= newObstacle.x &&
                    segment.x < newObstacle.x + newObstacle.width &&
                    segment.y >= newObstacle.y &&
                    segment.y < newObstacle.y + newObstacle.height
                );
                if (overlapsSnake) {
                    continue;
                }
                // Không để các địa hình đè lên nhau
                const overlapsObstacle = obstacles.some(obstacle =>
                    newObstacle.x < obstacle.x + obstacle.width &&
                    newObstacle.x + newObstacle.width > obstacle.x &&
                    newObstacle.y < obstacle.y + obstacle.height &&
                    newObstacle.y + newObstacle.height > obstacle.y
                );
                if (overlapsObstacle) {
                    continue;
                }
                obstacles.push(newObstacle);
            }
        }

        // DRAW OBSTACLES
        function drawObstacles() {
            obstacles.forEach(obstacle => {
                const x = obstacle.x * GRID_SIZE;
                const y = obstacle.y * GRID_SIZE;
                const width = obstacle.width * GRID_SIZE;
                const height = obstacle.height * GRID_SIZE;
                // Mặt địa hình
                ctx.fillStyle = "#8B5A2B";
                ctx.fillRect(x, y, width, height);

                // Viền nâu đậm
                ctx.strokeStyle = "#4A2A14";
                ctx.lineWidth = 4;
                ctx.strokeRect( x + 2, y + 2, width - 4, height - 4);
            });
        }

        // VẼ BẢN ĐỒ CHIA ĐÔI
         function drawMapSplit() {
            if (levelConfig.level !== "level3") {
                return;
            }
            const x =MAP_SPLIT_RIGHT * GRID_SIZE;
            ctx.fillStyle ="#3e2723";
            ctx.fillRect(x - 3, 0, 6,canvas.height);
            for (let y = 0; y < ROWS; y++) {
                if (isPortalCell(MAP_SPLIT_LEFT, y) || isPortalCell(MAP_SPLIT_RIGHT, y)) {
                    continue;
                }
                ctx.fillStyle = "#5d4037";
                ctx.fillRect(x - 3, y * GRID_SIZE, 6, GRID_SIZE);
            }
        }

        // TẠO CỔNG DỊCH CHUYỂN
        function createPortals() {
            portals = [];
            let attempts = 0;
            // PORTAL BÊN TRÁI
            while (portals.length < 1 && attempts < 1000) {
                attempts++;
                const x = Math.floor(Math.random() * (MAP_SPLIT_LEFT - PORTAL_MARGIN * 2)) + PORTAL_MARGIN;
                const y = Math.floor(Math.random() * (ROWS - PORTAL_HEIGHT));
                const newPortal = {
                    x: x,
                    y: y,
                    width: PORTAL_WIDTH,
                    height: PORTAL_HEIGHT,
                    side: "left"
                };
                // Không đè lên rắn
                const overlapsSnake = snake.some(segment =>
                    segment.x >= newPortal.x &&
                    segment.x < newPortal.x + newPortal.width &&
                    segment.y >= newPortal.y &&
                    segment.y < newPortal.y + newPortal.height
                );
                if (overlapsSnake) {
                    continue;
                }
                // Không đè lên thức ăn
                if (food && isPositionInsidePortal(food.x, food.y, newPortal)) {
                    continue;
                }
                // Không đè lên buff
                if (lifeBuff && isPositionInsidePortal( lifeBuff.x, lifeBuff.y,newPortal)) {
                    continue;
                }
                // Không đè lên địa hình
                const overlapsObstacle = obstacles.some(obstacle =>
                    newPortal.x < obstacle.x + obstacle.width &&
                    newPortal.x + newPortal.width > obstacle.x &&
                    newPortal.y < obstacle.y + obstacle.height &&
                    newPortal.y + newPortal.height > obstacle.y
                );
                if (overlapsObstacle) {
                    continue;
                }
                portals.push(newPortal);
            }
            // PORTAL BÊN PHẢI
            attempts = 0;
            while (portals.length < 2 && attempts < 1000) {
                attempts++;
                const rightStart = MAP_SPLIT_RIGHT + 1;
                const rightWidth = COLS - rightStart - PORTAL_MARGIN;
                const x = Math.floor(Math.random() * rightWidth) + rightStart;
                const y = Math.floor(Math.random() * (ROWS - PORTAL_HEIGHT));
                const newPortal = {
                    x: x,
                    y: y,
                    width: PORTAL_WIDTH,
                    height: PORTAL_HEIGHT,
                    side: "right"
                };
                // Không đè lên rắn
                const overlapsSnake = snake.some(segment =>
                    segment.x >= newPortal.x &&
                    segment.x < newPortal.x + newPortal.width &&
                    segment.y >= newPortal.y &&
                    segment.y < newPortal.y + newPortal.height
                );
                if (overlapsSnake) {
                    continue;
                }
                // Không đè lên thức ăn
                if (food && isPositionInsidePortal(food.x, food.y, newPortal)) {
                    continue;
                }
                // Không đè lên buff
                if (lifeBuff && isPositionInsidePortal(lifeBuff.x,mlifeBuff.y, newPortal)) {
                    continue;
                }
                // Không đè lên địa hình
                const overlapsObstacle = obstacles.some(obstacle =>
                    newPortal.x < obstacle.x + obstacle.width &&
                    newPortal.x + newPortal.width > obstacle.x &&
                    newPortal.y < obstacle.y + obstacle.height &&
                    newPortal.y + newPortal.height > obstacle.y
                );
                if (overlapsObstacle) {
                    continue;
                }
                portals.push(newPortal);
            }

            // FALLBACK
            if (portals.length < 2) {
                portals = [
                    {x: 5, y: 4, width: PORTAL_WIDTH, height: PORTAL_HEIGHT, side: "left"},
                    {x: 24, y: 12, width: PORTAL_WIDTH,height: PORTAL_HEIGHT, side: "right"}
                ];
            }
        }

        function isPositionInsidePortal(x, y, portal) {
            return (
                x >= portal.x &&
                x < portal.x + portal.width &&
                y >= portal.y &&
                y < portal.y + portal.height
            );
        }
         //KIỂM TRA Ô CÓ PHẢI PORTAL
        function isPortalCell(x, y) {
            if (levelConfig.level !== "level3") {
                return false;
            }

            return portals.some(portal =>
                isPositionInsidePortal(x, y, portal)
            );
        }

        //TÌM PORTAL ĐANG ĐỨNG
        function getPortalAt(x, y) {
            return portals.find(portal =>
                isPositionInsidePortal(x, y, portal)
            );
        }
        // TELEPORT RẮN
        function teleportSnake() {
            if (portals.length < 2) {
                return;
            }
            const head = snake[0];
            // Portal hiện tại
            const currentPortal = getPortalAt(head.x, head.y);
            if (!currentPortal) {
                return;
            }
            // Tìm portal còn lại
            const targetPortal = portals.find(portal => portal !== currentPortal);
            if (!targetPortal) {
                return;
            }
            // Giữ nguyên vị trí tương đối theo chiều Y
            const offsetY = head.y - currentPortal.y;
            let targetY = targetPortal.y + offsetY;
            // Đảm bảo không vượt khỏi portal
            targetY = Math.max(targetPortal.y, Math.min(targetPortal.y + targetPortal.height - 1, targetY));
            const targetX = targetPortal.x;
            // Kiểm tra rắn có đè lên thân của chính nó không
            const hitBody = snake.some(
                (segment, index) => {
                    if (index === 0) {
                        return false;
                    }
                    return (segment.x === targetX && segment.y === targetY);
                }
            );
            if (hitBody) {
                loseLife();
                return;
            }
            // Đưa đầu rắn sang portal đối diện
            snake[0] = {x: targetX, y: targetY};
            drawGame();
        }

        //PORTAL TIMER
        function startPortalTimer() {
            stopPortalTimer();
            portalCountdown = 15;
            updatePortalTimer();
            portalTimer =
                setInterval(
                    function () {
                        if (!gameRunning) {
                            return;
                        }
                        if (isPaused) {
                            return;
                        }
                        portalCountdown--;
                        updatePortalTimer();
                        if (portalCountdown <= 0) {
                            createPortals();
                            if (food && isPortalCell( food.x, food.y)) {
                                createFood();
                            }
                            if ( lifeBuff && isPortalCell( lifeBuff.x, lifeBuff.y)) {
                                relocateLifeBuff();
                            }
                            portalCountdown = 15;
                            updatePortalTimer();
                        }
                    },1000
                );
        }

        //STOP PORTAL TIMER
        function stopPortalTimer() {
            if (portalTimer) {
                clearInterval(portalTimer);
                portalTimer = null;
            }
        }

        //UPDATE PORTAL TIMER
        function updatePortalTimer() {
            portalTimeElement.textContent =portalCountdown;
        }

         //DI CHUYỂN BUFF NẾU CỔNG ĐÈ LÊN*
        function relocateLifeBuff() {
            if (!lifeBuff) {
                return;
            }
            let validPosition = false;
            let attempts = 0;
            while (!validPosition && attempts < 1000) {
                attempts++;
                const x =Math.floor(Math.random() * COLS);
                const y =Math.floor(Math.random() * ROWS);
                const onSnake = snake.some( segment =>segment.x === x && segment.y === y);
                if (onSnake) {
                    continue;
                }
                if (isPortalCell(x, y)) {
                    continue;
                }
                if (food && food.x === x && food.y === y) {
                    continue;
                }
                lifeBuff = {x: x, y: y};
                validPosition = true;
            }
        }

        // DRAW PORTALS
        function drawPortals() {
            if (levelConfig.level !== "level3") {
                return;
            }
            portals.forEach(
                (portal, index) => {
                    const x =portal.x * GRID_SIZE;
                    const y =portal.y * GRID_SIZE;
                    const width = portal.width * GRID_SIZE;
                    const height = portal.height * GRID_SIZE;
                    ctx.fillStyle ="#7e57c2";
                    ctx.fillRect( x, y,width,height);
                    ctx.lineWidth = 3;
                    ctx.strokeRect( x + 2, y + 2, width - 4, height - 4);
                    ctx.fillStyle = "rgba(255,255,255,0.25)";
                    ctx.fillRect( x + 5, y + 5, width - 10, height - 10);
                    ctx.fillStyle = "#ffffff";
                }
            );

        }



        // QUA LEVEL TIẾP THEO
        function checkNextLevel() {
            if (score < 150) return;
            const currentLevel = levelConfig.level;
            if (currentLevel === "level1") {
                window.location.href = "level2.html";
            }
            else if (currentLevel === "level2") {
                window.location.href = "level3.html";
            }
            else if (currentLevel === "level3") {
                window.location.href = "level4.html";
            }
            else if (currentLevel === "level4") {
                window.location.href = "level5.html";
            }
            else if (currentLevel === "level5") {
                // Hoàn thành game
                alert("Chúc mừng! Bạn đã hoàn thành tất cả các level!");
                window.location.href = "home.html";
            }
        }
  
        // UPDATE INFO
        function updateInfo() {
            document.getElementById("score").textContent = score;
            document.getElementById("lives").textContent = "❤️".repeat(lives);
        }

        // RESTART
        function restartGame() {
            initGame();
        }

        // HOME
        function goHome() {
            window.location.href ="home.html";
        }
        // START
        initGame();
    </script>
