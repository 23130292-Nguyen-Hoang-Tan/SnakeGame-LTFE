<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Snake Adventure - Level 1</title>
</head>

<body>
    <script>
        const levelConfig = {
            level: "level1",
            // Tốc độ rắn
            speed: 120,
            // 3 mạng
            lives: 3,
            // Có tăng chiều dài khi ăn
            growSnake: true,
            // Thức ăn
            food10: true,
            food20: true,
            // Không có chướng ngại vật
            obstacles: false,
            // Không có đạn
            bullets: false,
            // Không có portal
            portals: false
        };
        /*Lưu cấu hình để game.html đọc*/
        localStorage.setItem(
            "snakeLevelConfig",
            JSON.stringify(levelConfig)
        );
        window.location.href = "game.html";
    </script>

</body>

</html>
