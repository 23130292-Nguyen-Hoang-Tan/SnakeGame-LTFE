<!-- Hộp thoại Chọn Level -->
<style>
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(4px);
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            z-index: 100;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: all;
        }

        .modal-content {
            background-color: var(--modal-bg);
            border: 8px solid var(--modal-border);
            border-radius: 40px;
            padding: 40px;
            width: 90%;
            max-width: 500px;
            text-align: center;
            box-shadow: 0 25px 50px rgba(0,0,0,0.5), inset 0 0 0 6px rgba(255,255,255,0.5);
            transform: scale(0.5);
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
        }

        .modal-overlay.active .modal-content {
            transform: scale(1);
        }

        .modal-title {
            font-family: 'Fredoka One', cursive;
            font-size: 2.5rem;
            color: #d84315;
            margin-bottom: 25px;
            text-shadow: 2px 2px 0 #ffcc80;
        }

        /* Nút đóng */
        .close-btn {
            background: #f44336;
            color: white;
            border: 4px solid white;
            padding: 12px 40px;
            font-size: 1.5rem;
            font-family: 'Fredoka One', cursive;
            border-radius: 30px;
            box-shadow: 0 8px 0 #c62828;
            cursor: pointer;
            transition: 0.1s;
        }
        .close-btn:active {
            transform: translateY(8px);
            box-shadow: 0 0 0 transparent;
        }


        /* Chọn level*/
        .level-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 15px;
            margin-bottom: 30px;
        }

        .level-btn {
            font-family: 'Nunito', sans-serif;
            font-weight: 800;
            font-size: 1.4rem;
            padding: 15px;
            border-radius: 20px;
            border: 4px solid #e0e0e0;
            background: #fafafa;
            color: #616161;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .level-btn:hover {
            background: #e1f5fe;
            transform: scale(1.03);
        }

        .level-btn.active {
            background: #b2ff59;
            border-color: #64dd17;
            color: #33691e;
            box-shadow: 0 5px 0 #64dd17;
            transform: scale(1.05);
        }


</style>

<!-- Hộp thoại Chọn Level -->
    <div class="modal-overlay" id="levelModal">
        <div class="modal-content">
            <h2 class="modal-title">CHỌN ĐỘ KHÓ</h2>
            <div class="level-grid">
                <div class="level-btn" onclick="selectLevel(this, 'easy')">
                    <span>🌱 Dễ</span> <span>🐌</span>
                </div>
                <div class="level-btn active" onclick="selectLevel(this, 'medium')">
                    <span>🏃 Trung Bình</span> <span>🐕</span>
                </div>
                <div class="level-btn" onclick="selectLevel(this, 'hard')">
                    <span>🔥 Khó</span> <span>🐆</span>
                </div>
            </div>
            <button class="close-btn" onclick="closeModal('levelModal')">XONG</button>
        </div>
    </div>
