<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SNAKE GAME - LTFE</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --btn-green: #4caf50;
            --btn-green-shadow: #2e7d32;
            --btn-blue: #03a9f4;
            --btn-blue-shadow: #0277bd;
            --btn-orange: #ff9800;
            --btn-orange-shadow: #ef6c00;
            --modal-bg: #fff9c4;
            --modal-border: #f57f17;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }
        body {
            font-family: 'Nunito', cursive;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            background:
                linear-gradient(rgba(0,0,0,0.08), rgba(0,0,0,0.08)),
                url('img/home-bg.jpg') center center / cover no-repeat;
            position: relative;
        }
        .scenery-item {
            position: absolute;
            z-index: 3;
            font-size: 5rem;
            filter: drop-shadow(0 10px 5px rgba(0,0,0,0.3));
        }
        .ui-layer {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            pointer-events: none;
        }
        .ui-content {
            pointer-events: auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3vh;
            margin-top: 5vh;
        }
        .game-title {
            font-size: 8rem;
            font-weight: 800;
            color: #eeffc2;
            text-align: center;
            line-height: 1;
            letter-spacing: 4px;
            margin-bottom: 2vh;
            position: relative;
        }
        .game-title span {
            display: block;
            font-size: 8rem;
            color: #3c8947;
        }
        .snake-icon {
            position: absolute;
            font-size: 8rem;
            top: -20px;
            right: 40px;
            transform: rotate(15deg);
            filter: drop-shadow(0 5px 0 #1b5e20);
        }
        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 25px;
            width: 320px;
        }
        .btn {
            font-family: 'Nunito', bold, sans-serif;
            font-size: 1.8rem;
            color: white;
            padding: 18px 20px;
            border: 5px solid white;
            border-radius: 35px;
            cursor: pointer;
            text-transform: uppercase;
            transition: all 0.1s;
            position: relative;
            text-shadow: 2px 3px 0 rgba(0,0,0,0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
        }
        .btn-play {
            background-color: var(--btn-green);
            box-shadow: 0 10px 0 var(--btn-green-shadow), 0 20px 15px rgba(0,0,0,0.3);
        }
        .btn-level {
            background-color: var(--btn-blue);
            box-shadow: 0 10px 0 var(--btn-blue-shadow), 0 20px 15px rgba(0,0,0,0.3);
        }
        .btn-guide {
            background-color: var(--btn-orange);
            box-shadow: 0 10px 0 var(--btn-orange-shadow), 0 20px 15px rgba(0,0,0,0.3);
        }
        .btn:active {
            transform: translateY(10px);
            box-shadow: 0 0px 0 transparent !important;
        }
        @media (max-height: 700px) {
            .game-title { font-size: 7rem; }
            .btn { font-size: 1.4rem; padding: 12px 20px; }
            .ui-content { gap: 15px; }
        }
    </style>
</head>
<body>

    <div class="ui-layer">
        <div class="ui-content">
            <h1 class="game-title">SNAKE<span>ADVENTURE</span><div class="snake-icon">🐍</div></h1>
            <div class="btn-group">
                <button class="btn btn-play" onclick="playGame()">
                    <span>▶</span> CHƠI
                </button>
                <button class="btn btn-level" onclick="openModal('levelModal')">
                    <span>⭐</span> CHỌN LEVEL
                </button>
            </div>
        </div>
    </div>

    <!-- Modal -->
    <div id="levelModalContainer"></div>
</body>
<script>
    // Mặc định khi mở game là Level 1
    let selectedLevel = 'level1';

    // NẠP MODAL
    async function loadModals() {
        try {
            // Tải file level.html
            const response = await fetch("level.html");
            if (!response.ok) {
                throw new Error("Không thể tải level.html");
            }
            // Lấy nội dung HTML
            const html = await response.text();
            // Đưa HTML vào trang
            document.getElementById("levelModalContainer").innerHTML = html;
            // Lấy level đã lưu
            const savedLevel = localStorage.getItem("selectedLevel");
            // Kiểm tra level đã lưu
            if (savedLevel == "level1" ||
                savedLevel == "level2" ||
                savedLevel == "level3" ||
                savedLevel == "level4" ||
                savedLevel == "level5") {

                selectedLevel = savedLevel;
            }
            // Cập nhật nút level
            updateSelectedLevel();
        } catch (error) {
            console.log("Lỗi khi tải modal:", error);
        }
    }

    document.addEventListener(
        'DOMContentLoaded',
        loadModals
    );

    // CẬP NHẬT LEVEL ĐANG CHỌN TRÊN MODAL
    function updateSelectedLevel() {
        // Lấy tất cả nút chọn level
        const buttons = document.querySelectorAll(".level-btn");

        for (let i = 0; i < buttons.length; i++) {
            let button = buttons[i];
            // Xóa trạng thái active
            button.classList.remove("active");
            // Lấy nội dung onclick
            let onclickValue = button.getAttribute("onclick");
            // Kiểm tra nút có phải level đang chọn không
            if (onclickValue && onclickValue.includes("'" + selectedLevel + "'")) {
                button.classList.add("active");
            }
        }
    }

    // MỞ MODAL
    function openModal(modalId) {
        //Lấy ID của modal
        const modal = document.getElementById(modalId);
        if (!modal) {
            return;
        }
        //Thêm trạng thái active cho modal
        modal.classList.add('active');
    }

    // ĐÓNG MODAL
    function closeModal(modalId) {
        const modal =
            document.getElementById(modalId);
        if (!modal) return;
        modal.classList.remove('active');
    }

    // CHỌN LEVEL
   function selectLevel(element, level) {
        // Kiểm tra level có hợp lệ không
        if (level != "level1" &&
            level != "level2" &&
            level != "level3" &&
            level != "level4" &&
            level != "level5") {
            return;
        }

        // Lưu level được chọn
        selectedLevel = level;
        localStorage.setItem("selectedLevel", selectedLevel);
        // Lấy tất cả nút level
        const buttons = document.querySelectorAll(".level-btn");
        // Xóa active ở tất cả các nút
        for (let i = 0; i < buttons.length; i++) {
            buttons[i].classList.remove("active");
        }
        // Thêm active cho level vừa chọn
        element.classList.add("active");

        console.log("Đã chọn:", selectedLevel);
    }

    // NÚT CHƠI
    function playGame() {
        // Lưu level hiện tại
        localStorage.setItem('selectedLevel', selectedLevel);
        // Đóng modal nếu đang mở
        closeModal('levelModal');
        // Chuyển đến file cấu hình tương ứng
        if (selectedLevel === 'level1') {
            window.location.href = 'level1.html';
        }
        else if (selectedLevel === 'level2') {
            window.location.href = 'level2.html';
        }
        else if (selectedLevel === 'level3') {
            window.location.href = 'level3.html';
        }
        else if (selectedLevel === 'level4') {
            window.location.href = 'level4.html';
        }
        else if (selectedLevel === 'level5') {
            window.location.href = 'level5.html';
        }
    }
</script>
</html>
