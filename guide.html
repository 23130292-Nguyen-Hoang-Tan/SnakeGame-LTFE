<!-- Hộp thoại Hướng dẫn -->
<style>
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(4px);
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            z-index: 100;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: all;
        }

        .modal-content {
            background-color: var(--modal-bg);
            border: 8px solid var(--modal-border);
            border-radius: 40px;
            padding: 40px;
            width: 90%;
            max-width: 500px;
            text-align: center;
            box-shadow: 0 25px 50px rgba(0,0,0,0.5), inset 0 0 0 6px rgba(255,255,255,0.5);
            transform: scale(0.5);
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
        }

        .modal-overlay.active .modal-content {
            transform: scale(1);
        }

        .modal-title {
            font-family: 'Fredoka One', cursive;
            font-size: 2.5rem;
            color: #d84315;
            margin-bottom: 25px;
            text-shadow: 2px 2px 0 #ffcc80;
        }

        /* Nút đóng */
        .close-btn {
            background: #f44336;
            color: white;
            border: 4px solid white;
            padding: 12px 40px;
            font-size: 1.5rem;
            font-family: 'Fredoka One', cursive;
            border-radius: 30px;
            box-shadow: 0 8px 0 #c62828;
            cursor: pointer;
            transition: 0.1s;
        }
        .close-btn:active {
            transform: translateY(8px);
            box-shadow: 0 0 0 transparent;
        }


        /* Hướng dẫn */
        .guide-text {
            font-family: 'Nunito', sans-serif;
            font-size: 1.2rem;
            font-weight: 700;
            color: #4e342e;
            text-align: left;
            line-height: 1.6;
            background: rgba(255, 255, 255, 0.6);
            padding: 20px;
            border-radius: 20px;
            margin-bottom: 25px;
        }

        .guide-text kbd {
            background: #ffeb3b;
            padding: 4px 10px;
            border-radius: 8px;
            color: #d84315;
            border: 2px solid #fbc02d;
            box-shadow: 0 3px 0 #fbc02d;
            font-family: 'Fredoka One', cursive;
        }


</style>

<!-- Hộp thoại Hướng dẫn -->
    <div class="modal-overlay" id="instructionModal">

                <p style="margin-top: 15px;">🍎 Ăn thật nhiều trái cây để Rắn dài ra và ghi điểm.</p>
                <p style="margin-top: 15px;">💀 <b>Cẩn thận:</b> Trò chơi kết thúc nếu bạn tông vào tường hoặc cắn trúng đuôi mình!</p>
            </div>
            <button class="close-btn" onclick="closeModal('instructionModal')">ĐÃ HIỂU!</button>
        </div>
